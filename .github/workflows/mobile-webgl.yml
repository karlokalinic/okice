name: Mobile WebGL

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/MobileWeb/**'
      - '.github/workflows/mobile-webgl.yml'
  push:
    branches:
      - master
      - chatgpt/mobile-webgl-port
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/MobileWeb/**'
      - '.github/workflows/mobile-webgl.yml'

permissions:
  contents: read

concurrency:
  group: mobile-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile-webgl:
    name: Preflight + build + smoke + analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub LFS quota is currently exhausted. Never let checkout fail opaquely:
      # check out pointer stubs, classify them deterministically, and block only
      # when an unresolved object is actually required by the Unity project.
      GIT_LFS_SKIP_SMUDGE: '1'
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Checkout source without LFS download
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate mobile source contract
        run: node Tools/MobileWeb/preflight.mjs --root .

      - name: Audit unresolved Git LFS objects
        run: node Tools/MobileWeb/audit-lfs.mjs --root . --strict

      - name: Require Unity CI license
        if: env.UNITY_LICENSE == ''
        shell: bash
        run: |
          echo '## Unity build blocked' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static mobile validation passed, but repository secret `UNITY_LICENSE` is not configured.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The job fails deliberately: a green check must mean an actual Unity build was produced and smoke-tested.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::UNITY_LICENSE is not configured. Refusing to report a false-green mobile build.'
          exit 1

      - name: Unity Library cache
        if: env.UNITY_LICENSE != ''
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ runner.os }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef') }}
          restore-keys: |
            Library-WebGL-${{ runner.os }}-
            Library-WebGL-

      - name: Build production mobile WebGL
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: Karlolegend.Gradomraz.Editor.GradomrazBuild.BuildMobileWebGL
          allowDirtyBuild: true

      - name: Smoke-test generated WebGL
        if: env.UNITY_LICENSE != ''
        run: node Tools/MobileWeb/smoke-build.mjs --root Builds/WebGL-Mobile

      - name: Analyze mobile payload
        if: env.UNITY_LICENSE != ''
        run: node Tools/MobileWeb/analyze-build.mjs --root Builds/WebGL-Mobile --report-dir Builds/Reports

      - name: Upload mobile build and reports
        if: env.UNITY_LICENSE != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gradomraz-mobile-webgl-${{ github.sha }}
          path: |
            Builds/WebGL-Mobile
            Builds/Reports
            Builds/Logs
          if-no-files-found: warn
          retention-days: 7
