<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a1017">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d12; }
      body { color: #edf4f5; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
      #unity-container { position: relative; width: 100%; height: 100%; min-height: 360px; background: #111a22; overflow: hidden; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #111a22; }
      #loading-screen { position: absolute; inset: 0; display: grid; place-items: center; background: #0a1017; z-index: 2; transition: opacity 320ms ease; }
      #loading-screen.is-hidden { opacity: 0; pointer-events: none; }
      #loading-content { width: min(72vw, 430px); text-align: center; }
      #brand { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 8vw, 4.75rem); font-weight: 700; letter-spacing: 0.08em; color: #e9f2f2; text-shadow: 0 2px 0 #20303b; }
      #publisher { margin-top: 0.8rem; color: #9ab0b4; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; }
      #progress-track { height: 5px; margin: 2.6rem 0 0.8rem; background: #263640; overflow: hidden; }
      #progress-fill { width: 0%; height: 100%; background: #c0393d; transition: width 160ms linear; }
      #progress-label { color: #b8c7c9; font-size: 0.78rem; letter-spacing: 0.08em; }
      #unity-warning { position: absolute; right: 1rem; bottom: 1rem; max-width: min(90vw, 500px); z-index: 3; }
      .unity-message { margin-top: 0.5rem; padding: 0.75rem 0.9rem; background: #1c2830; border-left: 3px solid #c0393d; color: #edf4f5; font-size: 0.82rem; }
      .unity-message.warning { border-left-color: #d89c3a; }
      #fullscreen-button { position: absolute; right: 1rem; top: 1rem; z-index: 3; width: 42px; height: 42px; border: 1px solid #5c7076; background: #14212a; color: #edf4f5; cursor: pointer; font-size: 1.25rem; }
      #fullscreen-button:hover { background: #233640; }
      @media (max-width: 540px) { #unity-container { min-height: 100%; } #fullscreen-button { right: 0.7rem; top: 0.7rem; } }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <section id="loading-screen" aria-live="polite">
        <div id="loading-content">
          <div id="brand">{{{ PRODUCT_NAME }}}</div>
          <div id="publisher">{{{ COMPANY_NAME }}}</div>
          <div id="progress-track"><div id="progress-fill"></div></div>
          <div id="progress-label">Loading 0%</div>
        </div>
      </section>
      <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen">&#x26F6;</button>
      <div id="unity-warning"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loaderScreen = document.querySelector("#loading-screen");
      const progressFill = document.querySelector("#progress-fill");
      const progressLabel = document.querySelector("#progress-label");
      const warningArea = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const item = document.createElement("div");
        item.className = `unity-message ${type || ""}`;
        item.textContent = message;
        warningArea.appendChild(item);
        if (type !== "error") {
          setTimeout(() => item.remove(), 7000);
        }
      }

      function compatibilityHint() {
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const memory = Number(navigator.deviceMemory || 0);
        const cores = Number(navigator.hardwareConcurrency || 0);
        const effectiveType = String(connection?.effectiveType || "").toLowerCase();
        const constrainedNetwork = connection?.saveData === true || effectiveType === "slow-2g" || effectiveType === "2g";
        const constrainedMemory = memory > 0 && memory <= 4;
        const constrainedCpu = cores > 0 && cores <= 4;
        return constrainedNetwork || constrainedMemory || constrainedCpu ? "eco" : "balanced";
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: `${buildUrl}/{{{ DATA_FILENAME }}}`,
        frameworkUrl: `${buildUrl}/{{{ FRAMEWORK_FILENAME }}}`,
#if USE_THREADS
        workerUrl: `${buildUrl}/{{{ WORKER_FILENAME }}}`,
#endif
#if USE_WASM
        codeUrl: `${buildUrl}/{{{ CODE_FILENAME }}}`,
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: `${buildUrl}/{{{ SYMBOLS_FILENAME }}}`,
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: 1
      };

      const script = document.createElement("script");
      script.src = `${buildUrl}/{{{ LOADER_FILENAME }}}`;
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          const percent = Math.round(progress * 100);
          progressFill.style.width = `${percent}%`;
          progressLabel.textContent = `Loading ${percent}%`;
        }).then(instance => {
          try {
            instance.SendMessage("KARLOLEGEND_Compatibility", "ConfigureBrowserHint", compatibilityHint());
          } catch (error) {
            console.warn("Compatibility hardware hint was not accepted:", error);
          }

          loaderScreen.classList.add("is-hidden");
          setTimeout(() => loaderScreen.remove(), 350);
          document.querySelector("#fullscreen-button").onclick = () => instance.SetFullscreen(1);
        }).catch(error => unityShowBanner(error, "error"));
      };
      script.onerror = () => unityShowBanner("Unable to load the WebGL runtime.", "error");
      document.body.appendChild(script);
    </script>
  </body>
</html>
